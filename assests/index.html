<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/output.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>فرم ثبت نام انیمیشنی</title>
</head>

<body class="animate-color bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400 
bg-[lenght:200%_200%] min-h-screen flex justify-center items-center">
    <section class="w-full max-w-md p-8 bg-white rounded-2xl border border-gray-200 
    animate-fade-in shadow-2xl ">

        <div class="flex flex-col gap-2 items-center mb-6">
            <span class="bg-gray-400/50 h-16 w-16 rounded-full flex items-center justify-center animate-bounce">
                <i class="fas fa-user text-3xl text-gray-600"></i>
            </span>
            <h3 class="text-2xl font-bold text-gray-800">ثبت نام کنید</h3>
            <p class="text-sm te">لطفا اطلاعات خود را وارد کنید</p>
        </div>

        <form action="" class="space-y-4">
            <div class="flex items-center gap-3 border-b border-gray-300 py-2 
            focus-within:border-blue-400 transition-colors">
                <span><i class="fas fa-user"></i></span>
                <input type="email" placeholder="نام کاربری" class="text-gray-700 text-sm placeholder-gray-700 focus:outline-none bg-transparent
                flex-1 ">
            </div>
            </div>

            <div class="flex  items-center gap-3 border-b border-gray-300
            py-2 focus-within:border-blue-400 transition-colors">
                <span><i class="fa-regular fa-envelope"></i></span>
                <input type="email" placeholder="ایمیل" class="text-gray-700 text-sm placeholder-gray-700 focus:outline-none bg-transparent
                flex-1 ">
            </div>

            <div
                class="flex items-center gap-3 border-b border-gray-300 py-3 focus-within:border-blue-400 transition-colors ">
                <span><i class="fa-solid fa-user-lock"></i></span>
                <input type="password" placeholder="رمز عبور"
                    class="flex-1 bg-transparent text-sm text-gray-700 placeholder-gray-700 focus:outline-none ">
            </div>
        </form>

        <button
        class="w-full bg-blue-500  hover:bg-blue-600 text-white font-semibold mt-6 my-2 rounded 
        shadow-lg transition-all duration-300 ease-in-out transform scale-105 animate-button ">ثبت نام کنید</button>


    </section>

</body>

</html>
